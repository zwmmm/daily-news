<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极客前沿纪事报 - 每日纪事时间轴</title>
<style>
  :root {
    --bg-page: #f9f8f5;
    --card-bg: #ffffff;
    --border-subtle: #e8e6df;
    --border-hover: #111111;
    --text-main: #111827;
    --text-muted: #4b5563;
    --text-faint: #9ca3af;
    --accent: #d93829;
    --accent-light: #fff5f5;
    --quote-bg: #fbf9f2;
    --quote-border: #ebd9c8;
    --line-color: #e2dfd5;
    --line-active: #d93829;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-page);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    line-height: 1.65;
    padding: 48px 20px 80px;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
  }

  /* 顶部刊头 (Header / Hero) */
  .site-header {
    text-align: center;
    margin-bottom: 56px;
    padding-bottom: 36px;
    border-bottom: 1px solid var(--border-subtle);
    position: relative;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    border: 1px solid #e5e3db;
    padding: 4px 14px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.02);
  }

  .pulse-dot {
    width: 7px;
    height: 7px;
    background-color: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
    70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }

  .site-title {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: -0.02em;
    color: #111;
    line-height: 1.15;
    margin-bottom: 12px;
  }

  .site-subtitle {
    font-size: 15px;
    color: var(--text-muted);
    max-width: 580px;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* 分类与筛选栏 */
  .filter-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
    padding: 0 4px;
  }

  .filter-title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .filter-counter {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-faint);
    background: #eeebe3;
    padding: 2px 10px;
    border-radius: 12px;
  }

  /* 核心时间轴骨架 (Timeline Architecture) */
  .timeline {
    position: relative;
    padding-left: 48px;
  }

  /* 贯穿时间轴中线 */
  .timeline::before {
    content: "";
    position: absolute;
    left: 15px;
    top: 12px;
    bottom: 0;
    width: 2px;
    background: linear-gradient(180deg, var(--accent) 0%, var(--line-color) 12%, var(--line-color) 100%);
  }

  /* 年月分组锚点 (Month Group Header) */
  .timeline-group-header {
    position: relative;
    margin: 36px 0 28px -48px;
    padding-left: 48px;
    display: flex;
    align-items: center;
  }

  .timeline-group-header:first-child {
    margin-top: 0;
  }

  .group-node {
    position: absolute;
    left: 8px;
    width: 16px;
    height: 16px;
    background: #111;
    border: 3px solid var(--bg-page);
    border-radius: 50%;
  }

  .group-title {
    font-size: 15px;
    font-weight: 800;
    color: #111;
    letter-spacing: -0.01em;
  }

  /* 单个时间轴节点条目 */
  .timeline-item {
    position: relative;
    margin-bottom: 44px;
  }

  /* 节点指示圆环 */
  .item-node {
    position: absolute;
    left: -48px;
    top: 24px;
    width: 32px;
    height: 32px;
    background: var(--bg-page);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .item-dot {
    width: 12px;
    height: 12px;
    background: #ffffff;
    border: 3px solid #111;
    border-radius: 50%;
    transition: all 0.2s ease;
  }

  .timeline-item:hover .item-dot {
    background: var(--accent);
    border-color: var(--accent);
    transform: scale(1.2);
  }

  /* 日报卡片本体 (Modern Editorial Card) */
  .feed-card {
    background: var(--card-bg);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 26px 30px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02), 0 1px 3px rgba(0, 0, 0, 0.02);
    transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
  }

  .feed-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.03);
    border-color: #cfcac0;
  }

  /* 卡片顶部元数据 */
  .card-top-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .meta-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .date-badge {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-light);
    padding: 3px 9px;
    border-radius: 6px;
  }

  .weekday-text {
    font-size: 12px;
    color: var(--text-faint);
    font-weight: 500;
  }

  .issue-tag {
    font-size: 11.5px;
    font-weight: 700;
    color: #666;
    background: #f4f3ed;
    padding: 2px 8px;
    border-radius: 4px;
  }

  /* 标题与内容网格 */
  .card-layout {
    display: grid;
    grid-template-columns: 1fr 180px;
    gap: 24px;
    align-items: start;
    margin-bottom: 18px;
  }

  @media (max-width: 640px) {
    .card-layout {
      grid-template-columns: 1fr;
    }
    .timeline {
      padding-left: 36px;
    }
    .timeline::before {
      left: 11px;
    }
    .item-node {
      left: -36px;
    }
    .timeline-group-header {
      margin-left: -36px;
      padding-left: 36px;
    }
    .group-node {
      left: 4px;
    }
  }

  .card-headline {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.4;
    color: #111;
    text-decoration: none;
    display: block;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
    transition: color 0.15s ease;
  }

  .card-headline:hover {
    color: var(--accent);
  }

  /* 今日观察金句框 */
  .card-quote {
    background: var(--quote-bg);
    border-left: 3px solid #111;
    border-radius: 0 6px 6px 0;
    padding: 10px 14px;
    font-size: 13.5px;
    color: #2b2b2b;
    margin-bottom: 10px;
    font-weight: 500;
    line-height: 1.6;
  }

  .card-desc {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.62;
  }

  .card-cover {
    width: 100%;
    height: 120px;
    border-radius: 8px;
    object-fit: cover;
    border: 1px solid #e8e6de;
    display: block;
    box-shadow: 0 2px 6px rgba(0,0,0,0.02);
  }

  /* 卡片底部操作栏 */
  .card-bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #f2efe9;
    padding-top: 14px;
    margin-top: 6px;
  }

  .tag-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag-chip {
    font-size: 11px;
    font-weight: 600;
    color: #4b5563;
    background: #f4f2ea;
    border: 1px solid #e6e3d8;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .enter-link {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: gap 0.15s ease;
  }

  .enter-link:hover {
    gap: 7px;
    text-decoration: underline;
  }

  /* 底部 */
  .site-footer {
    text-align: center;
    margin-top: 72px;
    padding-top: 24px;
    border-top: 1px solid var(--border-subtle);
    font-size: 12px;
    color: var(--text-faint);
  }
</style>
</head>
<body>

<div class="container">

  <!-- 顶部刊头 -->
  <header class="site-header">
    <div class="status-pill">
      <span class="pulse-dot"></span>
      <span>每日早 09:00 自动聚合生成</span>
    </div>
    <h1 class="site-title">极客前沿纪事报</h1>
    <p class="site-subtitle">专注 AI 智能体、代码编程、大模型首发、macOS 小而美独立应用与中文推特热点讨论。条条可溯源，纯粹克制。</p>
  </header>

  <!-- 筛选与统计 -->
  <div class="filter-bar">
    <div class="filter-title">
      <span>纪事长廊 / TIMELINE FEED</span>
    </div>
    <span class="filter-counter" id="archive-count">加载中...</span>
  </div>

  <!-- 时间轴主体 -->
  <main class="timeline" id="timeline-container">
    <!-- 动态通过 JavaScript 渲染 -->
  </main>

  <!-- 页尾 -->
  <footer class="site-footer">
    <div>极客前沿纪事报 · 自动化引擎驱动排版 · 冷峻实测 · 去伪存真</div>
  </footer>

</div>

<script>
  function getWeekday(dateStr) {
    const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const d = new Date(dateStr);
    return isNaN(d.getTime()) ? '' : days[d.getDay()];
  }

  function getYearMonth(dateStr) {
    const parts = dateStr.split('-');
    if (parts.length >= 2) {
      return `${parts[0]} 年 ${parseInt(parts[1])} 月`;
    }
    return dateStr;
  }

  async function renderTimeline() {
    const container = document.getElementById('timeline-container');
    const counter = document.getElementById('archive-count');

    try {
      let res = await fetch('/api/posts');
      if (!res.ok) {
        res = await fetch('/posts/posts.json');
      }
      if (!res.ok) throw new Error('Failed to load posts index');
      const posts = await res.json();
      counter.innerText = `共归档 ${posts.length} 期`;

      let currentGroup = '';
      let html = '';

      posts.forEach(post => {
        const ym = getYearMonth(post.date);
        if (ym !== currentGroup) {
          currentGroup = ym;
          html += `
            <div class="timeline-group-header">
              <div class="group-node"></div>
              <div class="group-title">${currentGroup}</div>
            </div>
          `;
        }

        const weekday = getWeekday(post.date);

        html += `
          <article class="timeline-item">
            <div class="item-node">
              <div class="item-dot"></div>
            </div>

            <div class="feed-card">
              <div class="card-top-meta">
                <div class="meta-left">
                  <span class="date-badge">${post.date}</span>
                  ${weekday ? `<span class="weekday-text">${weekday}</span>` : ''}
                </div>
                <span class="issue-tag">第 ${post.issue} 期</span>
              </div>

              <div class="card-layout">
                <div>
                  <a href="${post.url}" class="card-headline">${post.title}</a>
                  ${post.observation ? `<div class="card-quote">“${post.observation}”</div>` : ''}
                  <div class="card-desc">${post.summary}</div>
                </div>

                ${post.heroImage ? `
                  <div>
                    <img src="${post.heroImage}" alt="${post.title}" class="card-cover">
                  </div>
                ` : ''}
              </div>

              <div class="card-bottom-bar">
                <div class="tag-group">
                  ${(post.tags || []).map(t => `<span class="tag-chip">${t}</span>`).join('')}
                </div>
                <a href="${post.url}" class="enter-link">阅读头版详情 →</a>
              </div>
            </div>
          </article>
        `;
      });

      container.innerHTML = html;

    } catch (err) {
      console.warn('Fallback rendering', err);
      counter.innerText = `共归档 1 期`;
      container.innerHTML = `
        <div class="timeline-group-header">
          <div class="group-node"></div>
          <div class="group-title">2026 年 9 月</div>
        </div>
        <article class="timeline-item">
          <div class="item-node">
            <div class="item-dot"></div>
          </div>
          <div class="feed-card">
            <div class="card-top-meta">
              <div class="meta-left">
                <span class="date-badge">2026-09-20</span>
                <span class="weekday-text">周六</span>
              </div>
              <span class="issue-tag">第 082 期</span>
            </div>
            <div class="card-layout">
              <div>
                <a href="/posts/2026-09-20.html" class="card-headline">Claude 3.7 Sonnet 多文件工程重构“降智截断”实测与系统级 Anchor 注入绕过技巧</a>
                <div class="card-quote">“智能体与代码编程的分水岭已从单轮代码生成转向基于 Git Worktree 的独立子智能体任务闭环与自动化测试自愈。”</div>
                <div class="card-desc">全网实测规避长代码 AST 路由降级；macOS 原生轻量菜单栏助手 MenuLLM 上架；中推热议 Cursor 对比 Windsurf；一人团队靠 Mac 视频工具月入 $8k 商业拆解。</div>
              </div>
              <div>
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200&auto=format&fit=crop" class="card-cover" alt="Cover">
              </div>
            </div>
            <div class="card-bottom-bar">
              <div class="tag-group">
                <span class="tag-chip">AI代码编程</span>
                <span class="tag-chip">智能体</span>
                <span class="tag-chip">苹果小而美</span>
                <span class="tag-chip">中推热议</span>
              </div>
              <a href="/posts/2026-09-20.html" class="enter-link">阅读头版详情 →</a>
            </div>
          </div>
        </article>
      `;
    }
  }

  renderTimeline();
</script>

</body>
</html>
